services:
  iris-mcp:
    build: .
    container_name: iris-mcp-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:8000"
    env_file:
      - .env
    networks:
      - iris_frontend
      - dfir-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sse')"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  iris_frontend:
    external: true
  dfir-network:
    external: true